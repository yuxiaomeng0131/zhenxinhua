<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>真心话 · DeepTalk</title>
<style>
  :root {
    --bg-1: #D6D2C4;
    --bg-2: #C9BFB0;
    --card: rgba(255, 252, 247, 0.55);
    --card-border: rgba(255, 255, 255, 0.45);
    --text-primary: #5C5347;
    --text-secondary: #8B8174;
    --accent: #A89B8C;
    --accent-deep: #8B7D6B;
    --shadow: 0 8px 32px rgba(92, 83, 71, 0.12);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: "PingFang SC", "Noto Serif SC", "Songti SC", "SimSun", serif;
    color: var(--text-primary);
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, #BFB8A8 100%);
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
  }

  body::before {
    content: "";
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background:
      radial-gradient(circle at 20% 30%, rgba(201, 191, 176, 0.6) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(183, 173, 160, 0.5) 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(214, 210, 196, 0.4) 0%, transparent 60%);
    z-index: -1;
    animation: drift 20s ease-in-out infinite alternate;
  }

  @keyframes drift {
    0% { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(-2%, 3%) rotate(2deg); }
  }

  /* ============ 视图切换 ============ */
  .view { width: 100%; }

  .view.hidden { display: none; }

  /* ID 选择器的 display:flex 会压过 .view.hidden，需用同级特异性覆盖 */
  #homeView.hidden,
  #gameView.hidden {
    display: none;
  }

  #homeView {
    height: 100%;
    max-width: 560px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0 28px;
    animation: fadeUp 0.6s ease-out;
  }

  #gameView {
    height: 100%;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    animation: fadeUp 0.6s ease-out;
  }

  .header {
    text-align: center;
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeDown 1s ease-out 0.2s forwards;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 8px;
    color: var(--text-primary);
    margin-bottom: 8px;
  }

  .header .subtitle {
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--text-secondary);
  }

  .header .divider {
    width: 40px;
    height: 1px;
    background: var(--accent);
    margin: 14px auto 0;
    opacity: 0.6;
  }

  /* ============ 首页板块 ============ */
  .board-hint {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--text-secondary);
    opacity: 0.7;
    margin-bottom: 18px;
  }

  .board-list {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .board-card {
    width: 100%;
    background: var(--card);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 22px 24px;
    box-shadow: var(--shadow);
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    animation: fadeUp 0.7s ease-out both;
  }

  .board-card:nth-child(1) { animation-delay: 0.15s; }
  .board-card:nth-child(2) { animation-delay: 0.25s; }
  .board-card:nth-child(3) { animation-delay: 0.35s; }

  .board-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 36px rgba(92, 83, 71, 0.18);
    border-color: rgba(255, 255, 255, 0.6);
  }

  .board-card:active {
    transform: translateY(0);
  }

  .board-head {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .board-emoji {
    font-size: 18px;
    line-height: 1;
  }

  .board-title {
    font-size: 16px;
    font-weight: 300;
    letter-spacing: 3px;
    color: var(--text-primary);
  }

  .board-desc {
    margin-top: 10px;
    font-size: 12px;
    line-height: 1.9;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
  }

  .board-foot {
    margin-top: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .board-count {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--accent-deep);
    border: 1px solid rgba(168, 155, 140, 0.35);
    border-radius: 999px;
    padding: 3px 10px;
  }

  .board-go {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-secondary);
    transition: color 0.25s ease;
  }

  .board-card:hover .board-go {
    color: var(--accent-deep);
  }

  /* ============ 游戏页 ============ */
  .back-row {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: flex-start;
    margin-bottom: 8px;
  }

  .btn-back {
    border: none;
    background: none;
    color: var(--text-secondary);
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 300;
    padding: 6px 4px;
    transition: color 0.25s ease;
  }

  .btn-back:hover {
    color: var(--accent-deep);
  }

  .card-container {
    width: 100%;
    max-width: 420px;
    perspective: 1200px;
    margin-bottom: 18px;
    min-height: 340px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    width: 100%;
    min-height: 320px;
    background: var(--card);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 44px 32px 36px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    opacity: 0;
    transform: translateY(12px);
    animation: cardIn 0.8s ease-out 0.4s forwards;
  }

  @keyframes cardIn {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .card.fade-out {
    animation: cardOut 0.35s ease-in forwards;
  }

  @keyframes cardOut {
    to {
      opacity: 0;
      transform: translateY(-8px);
    }
  }

  .card.fade-in {
    animation: cardInNew 0.5s ease-out 0.05s forwards;
  }

  @keyframes cardInNew {
    from {
      opacity: 0;
      transform: translateY(12px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .card::before {
    content: "「";
    position: absolute;
    top: 16px;
    left: 22px;
    font-size: 48px;
    color: var(--accent);
    opacity: 0.35;
    line-height: 1;
    font-family: "Songti SC", "SimSun", serif;
  }

  .card::after {
    content: "」";
    position: absolute;
    bottom: 60px;
    right: 22px;
    font-size: 48px;
    color: var(--accent);
    opacity: 0.35;
    line-height: 1;
    font-family: "Songti SC", "SimSun", serif;
  }

  .question {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 0;
  }

  .question-text {
    font-size: 19px;
    line-height: 2;
    text-align: center;
    color: var(--text-primary);
    font-weight: 300;
    letter-spacing: 1px;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 16px;
    border-top: 1px solid rgba(168, 155, 140, 0.2);
  }

  .tag {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-secondary);
    padding: 4px 10px;
    border: 1px solid rgba(168, 155, 140, 0.3);
    border-radius: 20px;
  }

  .counter {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--text-secondary);
  }

  .controls {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    opacity: 0;
    animation: fadeUp 1s ease-out 0.6s forwards;
  }

  .main-area {
    width: 100%;
    flex: 1 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: auto 0;
  }

  .bottom-area {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 2px;
  }

  .progress {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--text-secondary);
    opacity: 0.7;
  }

  .progress .dot {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--text-secondary);
    opacity: 0.5;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* —— 三个操作按钮：渐变由深至浅 —— */
  .btn-main {
    width: 100%;
    padding: 15px 28px;
    border: none;
    border-radius: 16px;
    font-size: 14px;
    letter-spacing: 6px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 300;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .btn-main .emoji {
    margin-right: 10px;
    letter-spacing: 0;
    font-size: 15px;
  }

  .btn-main:hover {
    transform: translateY(-2px);
  }

  .btn-main:active {
    transform: translateY(0);
  }

  .btn-main:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    transform: none;
  }

  /* 深：下一题 */
  .btn-deep {
    color: #FFFCF7;
    background: linear-gradient(135deg, #8B7D6B 0%, #A89B8C 100%);
    box-shadow: 0 4px 16px rgba(139, 125, 107, 0.28);
  }

  .btn-deep:hover {
    box-shadow: 0 6px 22px rgba(139, 125, 107, 0.36);
  }

  .btn-deep:active {
    box-shadow: 0 2px 10px rgba(139, 125, 107, 0.22);
  }

  /* 中：已回答 */
  .btn-mid {
    color: #FFFCF7;
    background: linear-gradient(135deg, #A89B8C 0%, #C0B4A4 100%);
    box-shadow: 0 4px 16px rgba(168, 155, 140, 0.25);
  }

  .btn-mid:hover {
    box-shadow: 0 6px 22px rgba(168, 155, 140, 0.33);
  }

  .btn-mid:active {
    box-shadow: 0 2px 10px rgba(168, 155, 140, 0.2);
  }

  /* 浅：重启题库 */
  .btn-light {
    color: var(--text-primary);
    background: linear-gradient(135deg, #C6BAA9 0%, #DDD6C6 100%);
    box-shadow: 0 4px 14px rgba(168, 155, 140, 0.18);
  }

  .btn-light:hover {
    box-shadow: 0 6px 20px rgba(168, 155, 140, 0.26);
  }

  .btn-light:active {
    box-shadow: 0 2px 8px rgba(168, 155, 140, 0.16);
  }

  .footer-quote {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-secondary);
    opacity: 0.55;
    white-space: nowrap;
  }

  @media (max-width: 380px) {
    .header h1 { font-size: 19px; letter-spacing: 6px; }
    .question-text { font-size: 17px; line-height: 1.9; }
    .card { min-height: 290px; padding: 38px 26px 30px; }
    .card-container { min-height: 310px; }
    .btn-main { padding: 13px 24px; font-size: 13px; letter-spacing: 4px; }
    .board-card { padding: 18px 20px; }
    .board-title { font-size: 15px; }
  }

  @media (min-width: 768px) {
    .card-container { max-width: 480px; min-height: 380px; }
    .card { min-height: 360px; padding: 56px 40px 44px; }
    .question-text { font-size: 21px; line-height: 2.1; }
    .controls { max-width: 480px; }
    .back-row { max-width: 480px; }
    .board-list { max-width: 480px; }
  }
</style>
</head>
<body>

  <!-- ======================= 首页：板块选择 ======================= -->
  <section id="homeView" class="view">
    <div class="header">
      <h1>真心话</h1>
      <div class="subtitle">D E E P &nbsp; T A L K</div>
      <div class="divider"></div>
    </div>

    <div class="board-hint">选 一 个 板 块 ，抽 你 的 第 一 张 卡</div>

    <div class="board-list">
      <button class="board-card" data-board="light">
        <div class="board-head">
          <span class="board-emoji">✨</span>
          <span class="board-title">轻日常闲聊</span>
        </div>
        <p class="board-desc">轻松无压力，适合破冰、普通聚会，偏向生活、喜好、小趣事，不深挖内心伤痛，无尖锐拷问。</p>
        <div class="board-foot">
          <span class="board-count" id="countLight">200 题</span>
          <span class="board-go">进入抽卡 →</span>
        </div>
      </button>

      <button class="board-card" data-board="deep">
        <div class="board-head">
          <span class="board-emoji">🕯️</span>
          <span class="board-title">深度话题</span>
        </div>
        <p class="board-desc">向内行走，与自己相遇。适合安静的夜晚和对的人，聊聊那些平时不常开口的问题。</p>
        <div class="board-foot">
          <span class="board-count" id="countDeep">— 题</span>
          <span class="board-go">进入抽卡 →</span>
        </div>
      </button>

      <button class="board-card" data-board="mixed">
        <div class="board-head">
          <span class="board-emoji">🎲</span>
          <span class="board-title">混合盲盒</span>
        </div>
        <p class="board-desc">轻日常与深度话题随机混抽，拆开才知道：今晚是浅浅一聊，还是走进内心。</p>
        <div class="board-foot">
          <span class="board-count" id="countMixed">— 题</span>
          <span class="board-go">进入抽卡 →</span>
        </div>
      </button>
    </div>
  </section>

  <!-- ======================= 游戏页：抽卡 ======================= -->
  <section id="gameView" class="view hidden">
    <div class="main-area">
      <div class="back-row">
        <button class="btn-back" id="backBtn">← 返回板块</button>
      </div>

      <div class="header" style="margin-bottom: 20px;">
        <h1 id="gameTitle" style="font-size: 18px;">轻日常闲聊</h1>
        <div class="subtitle" id="gameSub">L I G H T &nbsp; C H A T</div>
        <div class="divider"></div>
      </div>

      <div class="card-container">
        <div class="card" id="card">
          <div class="question">
            <p class="question-text" id="questionText">你觉得现在的生活，是过程还是结果？</p>
          </div>
          <div class="card-footer">
            <span class="tag" id="category">自我叩问</span>
            <span class="counter" id="counter">01 / 20</span>
          </div>
        </div>
      </div>

      <div class="progress" id="progress">
        <span id="progressRemaining">剩余 0 题</span>
        <span class="dot"></span>
        <span id="progressAnswered">已答 0 题</span>
      </div>

      <div class="controls">
        <button class="btn-main btn-deep" id="nextBtn"><span class="emoji">🎴</span>下 一 题</button>
        <button class="btn-main btn-mid" id="answeredBtn"><span class="emoji">✒️</span>已 回 答</button>
        <button class="btn-main btn-light" id="resetBtn"><span class="emoji">🌿</span>重 启 题 库</button>
      </div>
    </div>

    <div class="bottom-area">
      <div class="footer-quote">向内行走，与自己相遇</div>
    </div>
  </section>

<script>
  // —— 轻日常闲聊 200 题（轻松无压力，无尖锐拷问）——
  const LIGHT_RAW = [

    "你现在家里有养小动物吗？",
    "猫和狗，你的天平倾向哪边？",
    "你见过最可爱的动物是什么？",
    "如果变成一种动物过一天，你想变成什么？",

    { text: "你内心藏着什么不为人知小骄傲？", category: "深度对话" },
    { text: "随着年龄增长，你对时间看法变了吗", category: "深度对话" },
    { text: "排序题：金钱、健康、爱什么最重要", category: "深度对话" },
    { text: "人性的哪种特质你最珍视？", category: "深度对话" },
    { text: "说实话，你有过真心的嫉妒吗？", category: "深度对话" },
    { text: "你是习惯隐藏，还是习惯表达？", category: "深度对话" },
    { text: "你对友情的底线在哪里？", category: "深度对话" },
    { text: "最害怕重复经历什么样的痛苦？", category: "深度对话" },
    { text: "谁的眼神让你觉得有力量？", category: "深度对话" },
    { text: "那个让你心脏猛跳一拍的瞬间？", category: "深度对话" },
    { text: "哪怕全世界反对，也有人支持你吗？", category: "深度对话" },
    { text: "此时此刻，最想感谢谁？", category: "深度对话" }
  ];

  // —— 板块配置 ——
  const LIGHT_QUESTIONS = LIGHT_RAW.map(function (t) { return { text: t, category: "轻日常" }; });
  const MIXED_QUESTIONS = LIGHT_QUESTIONS.concat(DEEP_RAW);

  const BOARDS = {
    light: { title: "✨ 轻日常闲聊", sub: "L I G H T &nbsp; C H A T", questions: LIGHT_QUESTIONS },
    deep:  { title: "🕯️ 深度话题", sub: "D E E P &nbsp; T A L K", questions: DEEP_RAW },
    mixed: { title: "🎲 混合盲盒", sub: "M I X E D &nbsp; B O X", questions: MIXED_QUESTIONS }
  };

  // ====================== 状态与持久化 ======================
  const homeView = document.getElementById('homeView');
  const gameView = document.getElementById('gameView');
  const gameTitle = document.getElementById('gameTitle');
  const gameSub = document.getElementById('gameSub');
  const card = document.getElementById('card');
  const questionText = document.getElementById('questionText');
  const categoryEl = document.getElementById('category');
  const counterEl = document.getElementById('counter');
  const progressRemainingEl = document.getElementById('progressRemaining');
  const progressAnsweredEl = document.getElementById('progressAnswered');
  const nextBtn = document.getElementById('nextBtn');
  const answeredBtn = document.getElementById('answeredBtn');
  const resetBtn = document.getElementById('resetBtn');
  const backBtn = document.getElementById('backBtn');

  let boardKey = null;       // 当前板块：light / deep / mixed
  let questions = [];        // 当前板块题库
  let answered = new Set();  // 已回答的题目索引
  let currentIndex = -1;
  let isAnimating = false;

  function storageKey(key) {
    return 'deeptalk.state.v2.' + key;
  }

  function saveState() {
    if (!boardKey) return;
    try {
      localStorage.setItem(storageKey(boardKey), JSON.stringify({
        answered: Array.from(answered),
        currentIndex,
        // 版本号：若题库数量变化了，下一次加载会自动重置
        version: questions.length
      }));
    } catch (e) {}
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(storageKey(boardKey));
      if (!raw) return false;
      const s = JSON.parse(raw);
      if (!s || s.version !== questions.length) return false;
      answered = new Set(Array.isArray(s.answered) ? s.answered : []);
      if (typeof s.currentIndex === 'number' && s.currentIndex >= 0 && s.currentIndex < questions.length) {
        currentIndex = s.currentIndex;
      }
      return true;
    } catch (e) {
      return false;
    }
  }

  // 剩余待抽的索引池（不包含已回答）
  function getRemainingPool() {
    const pool = [];
    for (let i = 0; i < questions.length; i++) {
      if (!answered.has(i)) pool.push(i);
    }
    return pool;
  }

  function pad(n) {
    return n < 10 ? '0' + n : '' + n;
  }

  function updateProgress() {
    const total = questions.length;
    const done = answered.size;
    const left = total - done;
    progressRemainingEl.textContent = '剩余 ' + left + ' 题';
    progressAnsweredEl.textContent = '已答 ' + done + ' 题';
    counterEl.textContent = pad((currentIndex >= 0 ? currentIndex : 0) + 1) + ' / ' + pad(total);
  }

  function setButtonsEnabled(enabled) {
    nextBtn.disabled = !enabled;
    answeredBtn.disabled = !enabled;
  }

  // 从剩余池中随机抽一道与当前不同的；如果剩余池中只剩当前题，那就允许重复
  function pickNextRandom() {
    let pool = getRemainingPool();
    if (pool.length === 0) {
      // 全部答完了，无新题可抽 → 返回-1标记
      return -1;
    }
    const candidates = pool.filter(i => i !== currentIndex);
    const p = candidates.length > 0 ? candidates : pool;
    return p[Math.floor(Math.random() * p.length)];
  }

  function renderCurrent() {
    const q = questions[currentIndex];
    questionText.textContent = q.text;
    categoryEl.textContent = q.category;
    updateProgress();
  }

  // 切换题目（带动画）；targetIdx=-1 表示无题可抽
  function animateToCard(targetIdx, onDone) {
    if (isAnimating) return;
    isAnimating = true;
    setButtonsEnabled(false);

    card.classList.add('fade-out');

    setTimeout(() => {
      if (targetIdx >= 0) {
        currentIndex = targetIdx;
        renderCurrent();
        saveState();
        card.classList.remove('fade-out');
        card.classList.remove('fade-in');
        void card.offsetWidth;
        card.classList.add('fade-in');
      } else {
        questionText.textContent = '所有题目都已回答过，点击「重启题库」即可重新相遇。';
        categoryEl.textContent = '终章';
      }

      setTimeout(() => {
        isAnimating = false;
        const poolEmpty = getRemainingPool().length === 0;
        nextBtn.disabled = poolEmpty;
        answeredBtn.disabled = poolEmpty;
        if (onDone) onDone();
      }, 550);
    }, 350);
  }

  // —— 按钮动作 ——

  function actNext() {
    const nextIdx = pickNextRandom();
    animateToCard(nextIdx);
  }

  function actAnswered() {
    if (currentIndex >= 0) {
      answered.add(currentIndex);
      saveState();
      updateProgress();
    }
    const nextIdx = pickNextRandom();
    animateToCard(nextIdx);
  }

  function actReset() {
    answered = new Set();
    saveState();
    const firstIdx = Math.floor(Math.random() * questions.length);
    animateToCard(firstIdx, () => {
      const t = resetBtn.textContent;
      resetBtn.textContent = '🌿 已 重 启 ✓';
      setTimeout(() => { resetBtn.textContent = t; }, 1500);
    });
  }

  // —— 视图切换 ——

  function enterBoard(key) {
    boardKey = key;
    questions = BOARDS[key].questions;
    answered = new Set();
    currentIndex = -1;

    gameTitle.innerHTML = BOARDS[key].title;
    gameSub.innerHTML = BOARDS[key].sub;

    const loaded = loadState();
    if (!loaded || currentIndex < 0) {
      currentIndex = Math.floor(Math.random() * questions.length);
      saveState();
    }

    homeView.classList.add('hidden');
    gameView.classList.remove('hidden');
    gameView.style.animation = 'none';
    void gameView.offsetWidth;
    gameView.style.animation = '';

    // 重置卡片动画状态
    card.classList.remove('fade-out', 'fade-in');
    void card.offsetWidth;

    renderCurrent();
    const poolEmpty = getRemainingPool().length === 0;
    nextBtn.disabled = poolEmpty;
    answeredBtn.disabled = poolEmpty;
  }

  function goHome() {
    saveState();
    boardKey = null;
    questions = [];
    gameView.classList.add('hidden');
    homeView.classList.remove('hidden');
    homeView.style.animation = 'none';
    void homeView.offsetWidth;
    homeView.style.animation = '';
  }

  // —— 首页题数徽章 ——
  document.getElementById('countLight').textContent = BOARDS.light.questions.length + ' 题';
  document.getElementById('countDeep').textContent = BOARDS.deep.questions.length + ' 题';
  document.getElementById('countMixed').textContent = BOARDS.mixed.questions.length + ' 题';

  // ====================== 事件绑定 ======================
  document.querySelectorAll('.board-card').forEach(btn => {
    btn.addEventListener('click', () => enterBoard(btn.dataset.board));
  });

  nextBtn.addEventListener('click', actNext);
  answeredBtn.addEventListener('click', actAnswered);
  resetBtn.addEventListener('click', actReset);
  backBtn.addEventListener('click', goHome);
</script>
